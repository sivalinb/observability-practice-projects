[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /var/fluent-bit/chunks
    storage.sync full
    storage.checksum on
[INPUT]
    Name tail
    Path /data/logs/kafka.jsonl
    Tag replay
    Parser json
    DB /var/fluent-bit/tail.db
    DB.Sync Full
    Read_from_Head true
    Refresh_Interval 1
    storage.type filesystem
[OUTPUT]
    Name kafka
    Match replay
    Brokers kafka:9092
    Topics prep-events
    Format json
    Message_Key_Field event_id
    rdkafka.request.required.acks -1
    rdkafka.enable.idempotence true
    rdkafka.message.timeout.ms 0
    queue_full_retries 0
    Retry_Limit False
    storage.total_limit_size 64M
