[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /var/fluent-bit/chunks
    storage.sync full
    storage.checksum on
    storage.backlog.mem_limit 10M
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
[INPUT]
    Name tail
    Path /data/logs/app.jsonl
    Tag prep
    Parser json
    DB /var/fluent-bit/tail.db
    DB.Sync Full
    Read_from_Head true
    Refresh_Interval 1
    storage.type filesystem
[OUTPUT]
    Name loki
    Match prep
    Host loki
    Port 3100
    Labels job=observability-practice,project=$project
    Line_Format json
    Retry_Limit False
    storage.total_limit_size 64M
