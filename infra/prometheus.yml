global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: observability-practice
    static_configs: [{targets: [prep:8000]}]
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
  - job_name: live-sli
    static_configs: [{targets: [live-sli:8084]}]
