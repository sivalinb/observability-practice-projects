name: Verify practice projects
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-execution-evidence
          path: artifacts/
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/stack.py --replay up --build -d
      - run: python scripts/verify_stack.py --chaos --kafka
      - name: Collect stack logs
        if: always()
        run: docker compose --profile replay logs --no-color > stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-execution-evidence
          path: |
            artifacts/stack-verification.json
            stack.log
      - if: always()
        run: docker compose --profile replay down
